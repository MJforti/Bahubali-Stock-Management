<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bahubali Stock" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>Bahubali Enterprises - Stock Management</title>
    <meta name="description" content="Offline, mobile-first hardware stock & inventory management system for Bahubali Enterprises" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script>
      // If the app fails to start (for example after an update), never leave a
      // black screen: show the reason and a button that reloads a fresh copy.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) { errors.push((e.message || 'Load error') + (e.filename ? ' @ ' + e.filename.split('/').pop() : '')); }, true);
        window.addEventListener('unhandledrejection', function (e) { errors.push(String((e.reason && e.reason.message) || e.reason)); });
        function rescue() {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0 || document.getElementById('boot-rescue')) return;
          var box = document.createElement('div');
          box.id = 'boot-rescue';
          box.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#141415;color:#e7e5e4;font:15px/1.5 system-ui,sans-serif;text-align:center;z-index:200';
          box.innerHTML = '<div style="max-width:320px"><p style="font-size:20px;margin:0 0 8px">The app did not start</p><p style="color:#a8a29e;margin:0 0 20px">Your stock is safe. Tap below to load a fresh copy.</p><button id="boot-fix" style="width:100%;height:48px;border:0;border-radius:12px;background:#f59e0b;color:#0c0a09;font-weight:600;font-size:16px">Reload app</button><p id="boot-err" style="margin-top:16px;color:#78716c;font-size:12px;word-break:break-word"></p></div>';
          document.body.appendChild(box);
          document.getElementById('boot-err').textContent = errors.slice(0, 3).join(' | ');
          document.getElementById('boot-fix').onclick = function () {
            var jobs = [];
            if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.filter(function (n) { return n.indexOf('bahubali-precache-') === 0; }).map(function (n) { return caches.delete(n); })); }));
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
            Promise.all(jobs).catch(function () {}).then(function () { location.replace('/?fresh=' + Date.now()); });
          };
        }
        setTimeout(rescue, 8000);
        window.__bootRescue = rescue;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
